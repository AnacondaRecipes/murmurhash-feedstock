{% set name = "murmurhash" %}
{% set version = "1.0.15" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: 58e2b27b7847f9e2a6edf10b47a8c8dd70a4705f45dccb7bf76aeadacf56ba01

build:
  number: 0
  script: {{ PYTHON }} -m pip install . --no-deps --no-build-isolation --ignore-installed --no-cache-dir -vv
  skip: true  # [py<36 or py>315]

requirements:
  build:
    - {{ stdlib('c') }}
    - {{ compiler('c') }}
    - {{ compiler('cxx') }}
  host:
    - python
    - pip
    - setuptools
    - cython >=3.1
    - wheel
  run:
    - python

test:
  imports:
    - murmurhash
    - murmurhash.mrmr
  requires:
    - pytest
    - pip
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest --pyargs murmurhash.tests

about:
  home: https://github.com/explosion/murmurhash
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Cython bindings for MurmurHash2
  description: Cython bindings for MurmurHash2
  dev_url: https://github.com/explosion/murmurhash
  doc_url: https://github.com/explosion/murmurhash

extra:
  recipe-maintainers:
    - rmax
    - ines
    - honnibal
    - adrianeboyd
